name = "threat-intel-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Syncs both Radius Platform policies into KV every minute.
[triggers]
crons = ["* * * * *"]

[vars]
# Radius Platform projects (org: Radius). Prices, wallets and networks live in their policies.
RADIUS_PROJECT_ID_TESTNET = "01a1c624-b7ef-7332-b897-a03d0c31cb05" # Threat Intel Demo (testnet)
RADIUS_PROJECT_ID_MAINNET = "01a1c624-fd8c-77c2-88da-0043a26a1c8b" # Threat Intel Demo (mainnet)

# Shown in the UI and used as the swarm's funding wallet; payouts themselves follow the policy.
PAYMENT_ADDRESS = "0xDA60059faBf3e71338c27C505CED519f55d605DD"

# Secret, never committed: `wrangler secret put RADIUS_API_KEY` (or .dev.vars locally).
# An organization API key with endpoints:read.

# Optional per-network overrides
# RPC_URL_MAINNET = "https://rpc.radiustech.xyz/your-mainnet-rpc"
# RPC_URL_TESTNET = "https://rpc.testnet.radiustech.xyz"
# SBC_TOKEN_ADDRESS_MAINNET = "0x33ad9e4bd16b69b5bfded37d8b5d9ff9aba014fb"
# SBC_TOKEN_ADDRESS_TESTNET = "0x33ad9e4bd16b69b5bfded37d8b5d9ff9aba014fb"
# X402_PERMIT2_PROXY_MAINNET = "0x402085c248EeA27D92E8b30b2C58ed07f9E20001"
# X402_PERMIT2_PROXY_TESTNET = "0x402085c248EeA27D92E8b30b2C58ed07f9E20001"
# BATCH_CONTRACT_ADDRESS_MAINNET = "0x71e14b65a8305a9a95a675abccb993f929b53885"
# BATCH_CONTRACT_ADDRESS_TESTNET = "0x969ccd1a4dd08bdb490745b6a10a8a9365d05fd8"

# Policy cache, written by the sync and read on every request.
# Local dev ignores the id; before deploying: `wrangler kv namespace create RADIUS_POLICY`.
[[kv_namespaces]]
binding = "RADIUS_POLICY"
id = "replace-with-kv-namespace-id"

# Exact counters and payment claims (stops one payment buying two requests).
[[durable_objects.bindings]]
name = "RADIUS_LIMITER"
class_name = "RadiusCounter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RadiusCounter"]
